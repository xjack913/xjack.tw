name: 部署到 GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # 每天 22:00（台灣時間）重新建置一次，首頁「世界頻道」換上粉專最新貼文
    - cron: '0 14 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: 抓粉專最新貼文
        # 沒設 FB_PAGE_TOKEN 或臉書出錯都不會讓建置失敗，網站沿用 repo 裡那份
        run: node scripts/sync-fb-latest.mjs
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      - name: 建置
        run: npm run build
        env:
          # 正式網址放在 repo 的 Actions 變數 SITE_URL；沒設就用驗收用的子網域
          SITE_URL: ${{ vars.SITE_URL || 'https://new.xjack.tw' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
