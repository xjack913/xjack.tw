name: 部署到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 預設只能讀；能發布網站的權限只給 deploy，跑 npm 套件的 build 拿不到
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # action 固定到 commit，版本由 Dependabot 更新（.github/dependabot.yml）
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # 粉專精選貼文只在本機抓（docs/PLAN.md「世界頻道」）：權杖不進 CI，免得跟 npm 套件跑在同一個 job
      - name: 建置
        run: npm run build
        env:
          # 正式網址放在 repo 的 Actions 變數 SITE_URL；沒設就用驗收用的子網域
          SITE_URL: ${{ vars.SITE_URL || 'https://new.xjack.tw' }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      # 通知 Bing 等支援 IndexNow 的搜尋引擎來抓網站地圖裡的網址（ChatGPT 搜尋、Copilot 用的是 Bing 的索引）。
      # 金鑰本來就要公開放在網站上（public/<金鑰>.txt），不是祕密；只在正式網域跑，失敗也不擋部署。
      - name: 通知 IndexNow
        if: vars.SITE_URL == 'https://xjack.tw'
        continue-on-error: true
        env:
          INDEXNOW_KEY: e3d1fe02559f53425bc8a4db0fd93f33
        run: |
          urls=$(curl -fsS https://xjack.tw/sitemap-index.xml | grep -o '<loc>[^<]*' | sed 's/<loc>//' \
            | xargs -n1 curl -fsS | grep -o '<loc>[^<]*' | sed 's/<loc>//' | jq -R . | jq -sc .)
          jq -n --arg key "$INDEXNOW_KEY" --argjson urls "$urls" \
            '{host: "xjack.tw", key: $key, keyLocation: ("https://xjack.tw/" + $key + ".txt"), urlList: $urls}' \
            | curl -sS -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' \
              --data-binary @- -o /dev/null -w 'IndexNow 回應 %{http_code}\n'
