name: 部署到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 預設只能讀；能發布網站的權限只給 deploy，跑 npm 套件的 build 拿不到
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # action 固定到 commit，版本由 Dependabot 更新（.github/dependabot.yml）
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # 粉專精選貼文只在本機抓（docs/PLAN.md「世界頻道」）：權杖不進 CI，免得跟 npm 套件跑在同一個 job
      - name: 建置
        run: npm run build
        env:
          # 正式網址放在 repo 的 Actions 變數 SITE_URL；沒設就用驗收用的子網域
          SITE_URL: ${{ vars.SITE_URL || 'https://new.xjack.tw' }}
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
