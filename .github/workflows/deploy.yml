name: 部署到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 預設只能讀；能發布網站的權限只給 deploy，跑 npm 套件的 build 拿不到
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # action 固定到 commit，版本由 Dependabot 更新（.github/dependabot.yml）
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: 抓粉專精選貼文
        # 沒設 FB_PAGE_TOKEN 或臉書出錯都不會讓建置失敗，網站沿用 repo 裡那份
        run: node scripts/sync-fb-featured.mjs
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      - name: 建置
        run: npm run build
        env:
          # 正式網址放在 repo 的 Actions 變數 SITE_URL；沒設就用驗收用的子網域
          SITE_URL: ${{ vars.SITE_URL || 'https://new.xjack.tw' }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
