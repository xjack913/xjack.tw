<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=LXGW+WenKai+TC:wght@700&family=Noto+Sans+TC:wght@500;700&display=block">
<style>
  /* 分享預覽圖 1200×630：npm run og 用 headless Chrome 截圖成 public/og.jpg */
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #fff; }
  body { font-family: 'Noto Sans TC', sans-serif; color: #14263f; position: relative; }
  .left { position: absolute; left: 72px; top: 92px; width: 640px; }
  .who { font-size: 34px; font-weight: 700; color: #1e3a5f; display: flex; gap: 18px; align-items: baseline; }
  .who .hand { font-family: 'LXGW WenKai TC'; font-size: 44px; }
  .who .en { font-family: 'Barlow Condensed'; font-size: 44px; }
  .who .real { font-size: 26px; color: #3b4d63; font-weight: 500; }
  h1 { font-family: 'LXGW WenKai TC'; font-weight: 700; font-size: 92px; line-height: 1.18; margin: 34px 0 30px; color: #1e3a5f; }
  .roles { font-size: 26px; font-weight: 500; color: #3b4d63; line-height: 1.6; }
  .photo { position: absolute; right: 86px; top: 70px; width: 380px; height: 380px; }
  .photo::before { content: ''; position: absolute; inset: 22px -22px -22px 22px; background: #1e3a5f; border-radius: 10px; }
  .photo img { position: relative; width: 100%; height: 100%; border-radius: 10px; object-fit: cover; }
  .foot { position: absolute; left: 72px; right: 72px; bottom: 44px; display: flex; justify-content: space-between; align-items: center; font-size: 24px; font-weight: 700; color: #1e3a5f; }
  .foot .url { font-family: 'Barlow Condensed'; font-size: 34px; letter-spacing: .02em; }
  .bar { position: absolute; left: 72px; bottom: 100px; width: 300px; height: 8px; border-radius: 4px; background: #ff6b35; }
</style>
</head>
<body>
  <div class="left">
    <div class="who"><span class="hand">叉傑克</span><span class="en">XJack</span></div>
    <h1>生命的每一秒<br>都有意義。</h1>
    <div class="roles">RQ 跑力共同創辦人暨執行長<br>桐桐的爸爸、大盤市值仔、遊戲玩家</div>
  </div>
  <div class="photo"><img src="../../public/images/xjack-portrait.jpg" alt=""></div>
  <div class="bar"></div>
  <div class="foot"><span class="url">xjack.tw</span><span>#叉傑克 XJack</span></div>
</body>
</html>
